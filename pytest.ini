[pytest]
testpaths = tests src/tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short -q
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    rpc: marks tests that require RPC endpoint
    external: marks tests that require external tools (slither, mythril)
